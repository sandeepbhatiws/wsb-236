<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="max-w-7xl m-auto mt-9 flex justify-center gap-4">
        <div class="border rounded-2xl mb-4">
            <img src="images/budget_3.png" class="w-[350px]" id="image1" onmouseover="changeImage(1)" onmouseout="changeImage(2)"/>
        </div>
        <div class="border rounded-2xl mb-4">
            <img src="images/budget_4.png" class="w-[350px]" id="image2" onmouseenter="changeImage(1)" onmouseleave="changeImage(2)"/>
        </div>
    </div>

    <script>
        const changeImage = (i) => {
            if(i == 1){
                document.getElementById('image1').src = 'images/budget_4.png';
                document.getElementById('image2').src = 'images/budget_3.png';
            } else {
                document.getElementById('image2').src = 'images/budget_4.png';
                document.getElementById('image1').src = 'images/budget_3.png';
            }
        }

        const defaultImage = () => {
            document.getElementById('image2').src = 'images/budget_4.png';
            document.getElementById('image1').src = 'images/budget_3.png';
        }
    </script>
</body>
</html>
