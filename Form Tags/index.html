<html>
<head>
    <title>Form Tags</title>
</head>
<body>
    
    <form autocomplete="off">
        <input type="text" name="user_name" placeholder="Enter your name" required value="Testing" maxlength="15"
        pattern="[a-z,A-Z0-9 ]{2,15}"/>

        <input type="text" placeholder="Enter mobile number" pattern="[0-9]{8,10}"/>

        <input type="number" min="1" max="10"/>

        <input type="email" name="email" placeholder="Enter your email" required="required" value="test@gmail.com" readonly/>

        <input type="password" placeholder="Enter your password">

        <input type="date"/>
        <input type="file"/>

        <br>

        <input type="checkbox" checked> Cricket
        <input type="checkbox" checked> Football

        <br>

        <input type="">

        <input type="radio" name="gender" id="male"/>
        <label for="male">Male</label>


        <input type="radio" name="gender" id="female" checked/>
        <label for="female">Female</label>


        <br>

        <select disabled>
            <option>Select Education</option>
            <option>10th</option>
            <option selected>12th</option>
            <option selected>BCA</option>
        </select>

        <textarea rows="10" cols="50"></textarea>

        <br>

        <button type="submit">Submit</button>
        <button type="reset">Reest</button>
        <button type="button">Save</button>
    </form>

    <button>Save</button>
</body>
</html>
